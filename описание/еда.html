<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра - Еда и лечение</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }

        /* === ЛЕВАЯ НАВИГАЦИЯ === */
        .nav-panel {
            width: 70px;
            height: 95vh;
            max-height: 760px;
            background-color: #1a1a1a;
            border: 4px solid #444;
            border-right: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #555 #1a1a1a;
        }
        .nav-panel::-webkit-scrollbar { width: 4px; }
        .nav-panel::-webkit-scrollbar-track { background: #1a1a1a; }
        .nav-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

        .nav-btn {
            width: 56px;
            height: 56px;
            margin: 3px 0;
            border: 3px solid #555;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            transition: all 0.15s;
            line-height: 1.1;
        }
        .nav-btn span {
            font-size: 0.5rem;
            font-weight: 900;
            letter-spacing: 0.3px;
        }
        .nav-btn:hover { background-color: #3a3a3a; border-color: #888; }
        .nav-btn.active {
            background-color: #0d47a1;
            border-color: #42a5f5;
            box-shadow: 0 0 8px rgba(66,165,245,0.5);
        }

        /* === ОСНОВНАЯ СЦЕНА === */
        .game-screen {
            width: calc(95vw - 70px);
            height: 95vh;
            max-height: 760px;
            background-color: white;
            border: 12px solid black;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Шапка */
        .date-time {
            position: absolute;
            top: 10px;
            left: 14px;
            font-weight: 900;
            font-size: 0.85rem;
            color: black;
        }
        .top-right-stats {
            position: absolute;
            top: 10px;
            right: 14px;
            text-align: right;
            font-weight: 900;
            font-size: 0.8rem;
            color: black;
            line-height: 1.35;
        }

        /* Котёнок */
        .cat-box {
            position: absolute;
            top: 12%;
            left: 8%;
            background-color: black;
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cat-emoji { font-size: 3.5rem; line-height: 1; }

        /* Холодильник */
        .fridge-object {
            position: absolute;
            top: 15%;
            right: 12%;
            font-size: 5rem;
            line-height: 1;
            filter: drop-shadow(3px 3px 4px rgba(0,0,0,0.3));
        }

        /* Аптечка */
        .medkit-object {
            position: absolute;
            top: 55%;
            right: 12%;
            font-size: 4rem;
            line-height: 1;
            filter: drop-shadow(3px 3px 4px rgba(0,0,0,0.3));
        }

        /* Центральный текст */
        .center-text {
            position: absolute;
            top: 55%;
            left: 8%;
            width: 45%;
            text-align: center;
            font-weight: 900;
            font-size: 0.95rem;
            color: black;
            line-height: 1.35;
        }

        /* Кнопки действий */
        .action-buttons {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
        }
        .action-btn {
            padding: 7px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 900;
            color: white;
            cursor: pointer;
            border: 3px solid;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .feed-btn { background-color: #ff9800; border-color: #e65100; }
        .heal-btn { background-color: #4caf50; border-color: #2e7d32; }
        .action-btn:hover { opacity: 0.85; }
    </style>
</head>
<body>

    <!-- ЛЕВАЯ НАВИГАЦИЯ -->
    <div class="nav-panel">
        <button class="nav-btn" title="Дом">🏠<span>ДОМ</span></button>
        <button class="nav-btn" title="План">💰<span>ПЛАН</span></button>
        <button class="nav-btn active" title="Еда">🍕<span>ЕДА</span></button>
        <button class="nav-btn" title="Карта">🗺️<span>КАРТА</span></button>
        <button class="nav-btn" title="Ларёк">🛒<span>ЛАРЁК</span></button>
        <button class="nav-btn" title="Стройка">🔧<span>СТРОЙКА</span></button>
        <button class="nav-btn" title="СТО">🚗<span>СТО</span></button>
    </div>

    <div class="game-screen">
        <div class="date-time">Дата 01.01.2020 12:00</div>
        <div class="top-right-stats">
            нужное<br>
            100
        </div>

        <div class="cat-box">
            <span class="cat-emoji">🐱</span>
        </div>

        <div class="fridge-object">🧊</div>
        <div class="medkit-object">🧰</div>

        <div class="center-text">
            команда для еды и лечения.<br>
            деньги тратятся из банки нужное
        </div>

        <div class="action-buttons">
            <button class="action-btn feed-btn">🍖 Покормить — 20₡</button>
            <button class="action-btn heal-btn">💊 Лечение — 30₡</button>
        </div>
    </div>

</body>
</html>
