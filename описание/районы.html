<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта города - Районы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #222;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* === ЛЕВАЯ НАВИГАЦИЯ === */
        .nav-panel {
            width: 70px;
            height: 95vh;
            max-height: 760px;
            background-color: #1a1a1a;
            border: 4px solid #444;
            border-right: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #555 #1a1a1a;
        }
        .nav-panel::-webkit-scrollbar { width: 4px; }
        .nav-panel::-webkit-scrollbar-track { background: #1a1a1a; }
        .nav-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

        .nav-btn {
            width: 56px;
            height: 56px;
            margin: 3px 0;
            border: 3px solid #555;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            transition: all 0.15s;
            line-height: 1.1;
        }
        .nav-btn span {
            font-size: 0.5rem;
            font-weight: 900;
            letter-spacing: 0.3px;
        }
        .nav-btn:hover { background-color: #3a3a3a; border-color: #888; }
        .nav-btn.active {
            background-color: #0d47a1;
            border-color: #42a5f5;
            box-shadow: 0 0 8px rgba(66,165,245,0.5);
        }

        /* === ОСНОВНАЯ СЦЕНА === */
        .game-screen {
            width: calc(95vw - 70px);
            height: 95vh;
            max-height: 760px;
            background-color: white;
            border: 12px solid black;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Шапка */
        .date-time {
            position: absolute;
            top: 10px;
            left: 14px;
            font-weight: 900;
            font-size: 0.85rem;
            color: black;
            z-index: 10;
        }
        .stats-panel {
            position: absolute;
            top: 10px;
            right: 14px;
            text-align: right;
            font-weight: 900;
            font-size: 0.8rem;
            color: black;
            line-height: 1.35;
            z-index: 10;
        }

        /* Контейнер карты с scroll */
        .map-scroll-wrapper {
            position: absolute;
            top: 40px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            overflow: auto;
            border: 4px solid #333;
            background-color: #1a1a1a;
        }
        .map-scroll-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
        .map-scroll-wrapper::-webkit-scrollbar-track { background: #1a1a1a; }
        .map-scroll-wrapper::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }
        .map-scroll-wrapper::-webkit-scrollbar-corner { background: #1a1a1a; }

        .city-map {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(12, 1fr);
            gap: 10px;
            padding: 10px;
            min-width: 560px;
            min-height: 700px;
        }

        .plot {
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 50px;
            font-size: 2rem;
            line-height: 1;
            border: 2px solid #555;
        }

        .for-sale {
            background-color: #a3e6a3;
            color: #2e7d32;
            font-weight: 900;
            font-size: 0.9rem;
            text-align: center;
        }

        .label {
            position: absolute;
            top: 4px;
            left: 6px;
            font-size: 0.75rem;
            font-weight: 900;
            color: black;
        }

        .bg-grey { background-color: #e0e0e0; }

        .complex-plot {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px 0;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .shop-bg {
            background-color: black;
            padding: 3px;
            border-radius: 3px;
            font-size: 2rem;
        }
    </style>
</head>
<body>
