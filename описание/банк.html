<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра - Выбор действия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }

        /* === ЛЕВАЯ НАВИГАЦИЯ === */
        .nav-panel {
            width: 70px;
            height: 95vh;
            max-height: 760px;
            background-color: #1a1a1a;
            border: 4px solid #444;
            border-right: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #555 #1a1a1a;
        }
        .nav-panel::-webkit-scrollbar { width: 4px; }
        .nav-panel::-webkit-scrollbar-track { background: #1a1a1a; }
        .nav-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

        .nav-btn {
            width: 56px;
            height: 56px;
            margin: 3px 0;
            border: 3px solid #555;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            transition: all 0.15s;
            line-height: 1.1;
        }
        .nav-btn span {
            font-size: 0.5rem;
            font-weight: 900;
            letter-spacing: 0.3px;
        }
        .nav-btn:hover { background-color: #3a3a3a; border-color: #888; }
        .nav-btn.active {
            background-color: #0d47a1;
            border-color: #42a5f5;
            box-shadow: 0 0 8px rgba(66,165,245,0.5);
        }

        /* === ОСНОВНАЯ СЦЕНА === */
        .game-screen {
            width: calc(95vw - 70px);
            height: 95vh;
            max-height: 760px;
            background-color: white;
            border: 12px solid black;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.2rem;
        }

        /* Шапка */
        .date-time {
            position: absolute;
            top: 10px;
            left: 14px;
            font-weight: 900;
            font-size: 0.85rem;
            color: black;
        }
        .stats-panel {
            position: absolute;
            top: 10px;
            right: 14px;
            text-align: right;
            font-weight: 900;
            font-size: 0.8rem;
            color: black;
            line-height: 1.35;
        }

        /* Контейнер вариантов */
        .options-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        /* Каждый вариант */
        .option {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .option:hover { transform: scale(1.04); }

        .emoji-box {
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .top-option .emoji-box {
            background-color: black;
            padding: 6px;
            border-radius: 5px;
        }

        .text {
            font-size: 1.1rem;
            font-weight: 900;
            color: black;
            line-height: 1.2;
        }

        .bottom-row {
            width: 70%;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- ЛЕВАЯ НАВИГАЦИЯ -->
    <div class="nav-panel">
        <button class="nav-btn" title="Дом">🏠<span>ДОМ</span></button>
        <button class="nav-btn active" title="План">💰<span>ПЛАН</span></button>
        <button class="nav-btn" title="Еда">🍕<span>ЕДА</span></button>
        <button class="nav-btn" title="Карта">🗺️<span>КАРТА</span></button>
        <button class="nav-btn" title="Ларёк">🛒<span>ЛАРЁК</span></button>
        <button class="nav-btn" title="Стройка">🔧<span>СТРОЙКА</span></button>
        <button class="nav-btn" title="СТО">🚗<span>СТО</span></button>
    </div>

    <div class="game-screen">
        <div class="date-time">Дата 01.01.2020 12:00</div>
        <div class="stats-panel">
            нужное \ желаемое \ копилка<br>
            100 \ 200 \ 200
        </div>

        <div class="options-container">
            <div class="option top-option">
                <div class="emoji-box">🚛💸</div>
                <div class="text">деньги в желаемое</div>
            </div>
            <div class="bottom-row">
                <div class="option">
                    <div class="emoji-box">👖💵</div>
                    <div class="text">деньги в карман<br>на нужное</div>
                </div>
                <div class="option">
                    <div class="emoji-box">🏦🤲💵</div>
                    <div class="text">деньги в копилку</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
