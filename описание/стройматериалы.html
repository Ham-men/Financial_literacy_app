<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин стройматериалов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }

        /* === ЛЕВАЯ НАВИГАЦИЯ === */
        .nav-panel {
            width: 70px;
            height: 95vh;
            max-height: 760px;
            background-color: #1a1a1a;
            border: 4px solid #444;
            border-right: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #555 #1a1a1a;
        }
        .nav-panel::-webkit-scrollbar { width: 4px; }
        .nav-panel::-webkit-scrollbar-track { background: #1a1a1a; }
        .nav-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

        .nav-btn {
            width: 56px;
            height: 56px;
            margin: 3px 0;
            border: 3px solid #555;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            transition: all 0.15s;
            line-height: 1.1;
        }
        .nav-btn span {
            font-size: 0.5rem;
            font-weight: 900;
            letter-spacing: 0.3px;
        }
        .nav-btn:hover { background-color: #3a3a3a; border-color: #888; }
        .nav-btn.active {
            background-color: #0d47a1;
            border-color: #42a5f5;
            box-shadow: 0 0 8px rgba(66,165,245,0.5);
        }

        /* === ОСНОВНАЯ СЦЕНА === */
        .game-screen {
            width: calc(95vw - 70px);
            height: 95vh;
            max-height: 760px;
            background-color: white;
            border: 12px solid black;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Шапка */
        .date-time {
            position: absolute;
            top: 10px;
            left: 14px;
            font-weight: 900;
            font-size: 0.85rem;
            color: black;
            z-index: 10;
        }
        .stats-panel {
            position: absolute;
            top: 10px;
            right: 14px;
            text-align: right;
            font-weight: 900;
            font-size: 0.8rem;
            color: black;
            line-height: 1.35;
            z-index: 10;
        }

        /* Дверь */
        .door {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 22px;
            background-color: white;
            border: 2px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .door::before, .door::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            background-color: #aaa;
        }
        .door::before { top: 7px; }
        .door::after { bottom: 7px; }

        /* Касса */
        .cash-register-area {
            position: absolute;
            top: 12%;
            left: 6%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .cash-register-icon {
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: 6px;
            filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.3));
        }
        .label {
            font-weight: 900;
            font-size: 0.85rem;
            color: black;
            line-height: 1.2;
        }

        /* Купить товар */
        .buy-goods-area {
            position: absolute;
            bottom: 10%;
            left: 6%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .buy-goods-icon {
            font-size: 3rem;
            line-height: 1;
            margin-bottom: 6px;
            filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.3));
            display: flex;
            gap: 4px;
        }

        /* Полки */
        .shelf-container {
            position: absolute;
            right: 10%;
            width: 120px;
            height: 170px;
            display: flex;
            align-items: center;
        }
        .top-shelf { top: 14%; }
        .bottom-shelf { top: 52%; }

        .shelf {
            position: absolute;
            right: 0;
            width: 75px;
            height: 100%;
            background-color: #a07a55;
            border: 2px solid #7a5a3a;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .customer {
            position: absolute;
            left: -35px;
            font-size: 3rem;
            line-height: 1;
        }
        .tool-box {
            background-color: white;
            border: 1px solid #ccc;
            padding: 6px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            transform: translateX(8px);
        }
        .tool-box span {
            font-size: 2rem;
            line-height: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Кнопка найма */
        .hire-btn {
            position: absolute;
            bottom: 12px;
            right: 14px;
            padding: 7px 16px;
            background-color: #2196f3;
            border: 3px solid #1565c0;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 900;
            color: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .hire-btn:hover { background-color: #1e88e5; }
    </style>
</head>
<body>

    <!-- ЛЕВАЯ НАВИГАЦИЯ -->
    <div class="nav-panel">
        <button class="nav-btn" title="Дом">🏠<span>ДОМ</span></button>
        <button class="nav-btn" title="План">💰<span>ПЛАН</span></button>
        <button class="nav-btn" title="Еда">🍕<span>ЕДА</span></button>
        <button class="nav-btn" title="Карта">🗺️<span>КАРТА</span></button>
        <button class="nav-btn" title="Ларёк">🛒<span>ЛАРЁК</span></button>
        <button class="nav-btn active" title="Стройка">🔧<span>СТРОЙКА</span></button>
        <button class="nav-btn" title="СТО">🚗<span>СТО</span></button>
    </div>

    <div class="game-screen">
        <div class="date-time">Дата 01.01.2020 12:00</div>
        <div class="stats-panel">
            нужное \ желаемое \ копилка<br>
            100 \ 200 \ 200
        </div>

        <div class="door"></div>

        <!-- Касса -->
        <div class="cash-register-area">
            <div class="cash-register-icon">🧾</div>
            <div class="label">касса<br>нанять кассира</div>
        </div>

        <!-- Купить товар -->
        <div class="buy-goods-area">
            <div class="buy-goods-icon">📋📦</div>
            <div class="label">купить товар</div>
        </div>

        <!-- Верхняя полка с инструментами -->
        <div class="shelf-container top-shelf">
            <div class="customer">🧑</div>
            <div class="shelf">
                <div class="tool-box">
                    <span>🔧</span><span>🪛</span>
                    <span>🗜️</span><span>🔨</span>
                </div>
            </div>
        </div>

        <!-- Нижняя полка с инструментами -->
        <div class="shelf-container bottom-shelf">
            <div class="customer">🧑</div>
            <div class="shelf">
                <div class="tool-box">
                    <span>🔧</span><span>🪛</span>
                    <span>🗜️</span><span>🔨</span>
                </div>
            </div>
        </div>

        <button class="hire-btn">👤 Нанять кладовщика</button>
    </div>

</body>
</html>
