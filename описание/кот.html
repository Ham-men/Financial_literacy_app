<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра - Комната с котом</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }

        /* === ЛЕВАЯ НАВИГАЦИЯ === */
        .nav-panel {
            width: 70px;
            height: 95vh;
            max-height: 760px;
            background-color: #1a1a1a;
            border: 4px solid #444;
            border-right: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #555 #1a1a1a;
        }
        .nav-panel::-webkit-scrollbar { width: 4px; }
        .nav-panel::-webkit-scrollbar-track { background: #1a1a1a; }
        .nav-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

        .nav-btn {
            width: 56px;
            height: 56px;
            margin: 3px 0;
            border: 3px solid #555;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            transition: all 0.15s;
            line-height: 1.1;
        }
        .nav-btn span {
            font-size: 0.5rem;
            font-weight: 900;
            letter-spacing: 0.3px;
        }
        .nav-btn:hover { background-color: #3a3a3a; border-color: #888; }
        .nav-btn.active {
            background-color: #0d47a1;
            border-color: #42a5f5;
            box-shadow: 0 0 8px rgba(66,165,245,0.5);
        }

        /* === ОСНОВНАЯ СЦЕНА === */
        .game-screen {
            width: calc(95vw - 70px);
            height: 95vh;
            max-height: 760px;
            background-color: white;
            border: 12px solid black;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Шапка */
        .date-time {
            position: absolute;
            top: 10px;
            left: 14px;
            font-weight: 900;
            font-size: 0.85rem;
            color: black;
        }
        .stats-panel {
            position: absolute;
            top: 10px;
            right: 14px;
            text-align: right;
            font-weight: 900;
            font-size: 0.8rem;
            color: black;
            line-height: 1.35;
        }

        /* Окно */
        .window-object {
            position: absolute;
            top: 10%;
            left: 38%;
            width: 120px;
            height: 120px;
            background: linear-gradient(to bottom, #87CEEB 50%, #7CFC00 50%);
            border: 10px solid #6b4c3a;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }
        .window-object::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                linear-gradient(to right, transparent 48%, #6b4c3a 48%, #6b4c3a 52%, transparent 52%),
                linear-gradient(to bottom, transparent 48%, #6b4c3a 48%, #6b4c3a 52%, transparent 52%);
        }

        /* Кот на коврике */
        .cat-area {
            position: absolute;
            top: 52%;
            left: 12%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .rug {
            width: 180px;
            height: 65px;
            background-color: #5c3a21;
            border-radius: 50%;
            border: 7px solid #d2b48c;
            box-shadow: inset 0 0 0 10px #5c3a21, inset 0 0 0 18px #d2b48c, inset 0 0 0 26px #5c3a21;
            position: relative;
            z-index: 1;
        }
        .cat-box {
            position: absolute;
            top: -38px;
            background-color: black;
            padding: 6px;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cat-emoji { font-size: 3.5rem; line-height: 1; }

        /* Кровать */
        .bed-object {
            position: absolute;
            top: 55%;
            left: 62%;
            font-size: 5.5rem;
            line-height: 1;
            transform: rotate(-5deg);
        }

        /* Кнопка кормления */
        .feed-btn {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 22px;
            background-color: #ff9800;
            border: 3px solid #e65100;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 900;
            color: white;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        .feed-btn:hover { background-color: #f57c00; }
    </style>
</head>
<body>

    <!-- ЛЕВАЯ НАВИГАЦИЯ -->
    <div class="nav-panel">
        <button class="nav-btn active" title="Дом">🏠<span>ДОМ</span></button>
        <button class="nav-btn" title="План">💰<span>ПЛАН</span></button>
        <button class="nav-btn" title="Еда">🍕<span>ЕДА</span></button>
        <button class="nav-btn" title="Карта">🗺️<span>КАРТА</span></button>
        <button class="nav-btn" title="Ларёк">🛒<span>ЛАРЁК</span></button>
        <button class="nav-btn" title="Стройка">🔧<span>СТРОЙКА</span></button>
        <button class="nav-btn" title="СТО">🚗<span>СТО</span></button>
    </div>

    <div class="game-screen">
        <div class="date-time">Дата 01.01.2020 12:00</div>
        <div class="stats-panel">
            нужное \ желаемое \ копилка<br>
            100 \ 200 \ 200<br>
            <br>
            параметры<br>
            сытость ---<br>
            настроение --<br>
            бодрость --
        </div>

        <div class="window-object">🪟</div>

        <div class="cat-area">
            <div class="rug"></div>
            <div class="cat-box">
                <span class="cat-emoji">🐱</span>
            </div>
        </div>

        <div class="bed-object">🛏️</div>

        <button class="feed-btn">🍖 Покормить Финни</button>
    </div>

</body>
</html>
